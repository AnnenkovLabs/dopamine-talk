name: New Edition, Skill, or Agent Adapter
description: Suggest a native language edition, agent integration, or skill improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Request Type
      options:
        - Native language edition
        - Coding agent adapter / plugin manifest
        - Prompt / skill improvement
        - Real Before/After showcase example
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      placeholder: Share the target language/agent or paste the Before vs After example you have in mind.
    validations:
      required: true
