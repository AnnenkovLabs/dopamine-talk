name: Check skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Strict YAML frontmatter & plugin manifests
        run: |
          npm install --no-save --no-package-lock yaml@2.6.1
          node tests/frontmatter.mjs
      - name: Clean UTF-8 encoding
        run: node tests/text-encoding.mjs
      - name: Local links & assets
        run: node tests/links.mjs
      - name: Shell script syntax
        run: bash -n install.sh
